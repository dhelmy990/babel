name: Website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_DB: study_dev
          POSTGRES_USER: study_dev
          POSTGRES_PASSWORD: study_dev
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -h 127.0.0.1 -U study_dev -d study_dev" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-deployment-0123456789
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      REVIEW_EMAIL_DELIVERY: console
      DB_NAME: study_dev
      DB_USER: study_dev
      DB_PASSWORD: study_dev
      DB_HOST: 127.0.0.1
      DB_PORT: '5433'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --omit=dev && npm run vendor
      - run: python -m pytest -q
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: website.production_settings
          DJANGO_DEBUG: 'false'
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - name: Validate scheduler units without starting host services
        run: |
          unit_dir=$(mktemp -d)
          cp deploy/review-digest.service deploy/review-digest.timer "$unit_dir/"
          printf '[Service]\nType=oneshot\nExecStart=/usr/bin/true\n' > "$unit_dir/docker.service"
          printf '[Unit]\nDescription=Verification target\n' > "$unit_dir/sysinit.target"
          SYSTEMD_UNIT_PATH="$unit_dir" systemd-analyze verify "$unit_dir/review-digest.service" "$unit_dir/review-digest.timer"
          rm -r "$unit_dir"
      - run: docker build --build-arg STUDY_RELEASE="$GITHUB_SHA" -t study-d1:verification .
      - run: docker run --rm -i --network none caddy:2.11.4@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017 caddy validate --config /dev/stdin --adapter caddyfile < deploy/Caddyfile
      - name: Install pinned age into a disposable verification directory
        run: |
          age_dir=$(mktemp -d "$HOME/study-age-XXXXXX")
          curl --fail --silent --show-error --location --max-time 60 https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o "$age_dir/age.tar.gz"
          printf '%s  %s\n' cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 "$age_dir/age.tar.gz" | sha256sum --check
          tar -xzf "$age_dir/age.tar.gz" -C "$age_dir"
          echo "STUDY_AGE_BINARY=$age_dir/age/age" >> "$GITHUB_ENV"
      - run: python -m pytest tests/test_deployment.py tests/test_smoke.py tests/test_recovery_bundle.py -q
        env:
          STUDY_DEPLOYMENT_IMAGE: study-d1:verification
