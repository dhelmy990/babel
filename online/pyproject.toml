[build-system]
requires = ["setuptools>=75,<76", "wheel>=0.45,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "babel-online"
version = "0.1.0"
description = "Babel synchronous online recommendation demo"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "numpy>=2.2,<2.3",
  "pydantic>=2.10,<2.11",
  "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<8.4",
]
pgvector = [
  "pgvector>=0.3,<0.4",
  "psycopg[binary]>=3.2,<3.3",
]
kafka = [
  "confluent-kafka>=2.6,<3",
]
parquet = [
  "pyarrow>=17,<26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "kafka: requires a real Kafka service",
  "pgvector: requires a real PostgreSQL/pgvector service",
]

[tool.setuptools.packages.find]
where = ["src"]
