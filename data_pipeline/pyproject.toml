[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babel-data"
version = "0.1.0"
description = "Babel distillation data acquisition and validation"
requires-python = ">=3.10,<3.13"
dependencies = [
  "jsonschema==4.23.0",
  "pyarrow==17.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
babel_data = ["schemas/*.json"]
