name: dhelmy-study

services:
  db:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: study_dev
      POSTGRES_USER: study_dev
      POSTGRES_PASSWORD: study_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - study_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_dev -d study_dev"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  study_db:
